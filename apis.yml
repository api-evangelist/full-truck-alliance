description: 'Full Truck Alliance Co. Ltd. (Manbang Group / 满帮集团, NYSE: YMM) operates a leading
  digital freight platform in China that connects truckers and shippers to make road transportation more
  efficient. It runs the Yunmanman (运满满) and Huochebang (货车帮) mobile apps, applying mobile internet,
  big data, and artificial intelligence to freight matching, brokerage, transaction services, and value-added
  offerings across hundreds of cities and tens of thousands of routes. It was surfaced as a portfolio company
  of dcm-ventures, hongshan, and softbank-vision-fund and added to the API Evangelist network. As of this
  enrichment pass the company publishes no public developer portal, API documentation, or open platform on
  its corporate site; this profile carries verified company identity plus a probed domain-security posture.'
